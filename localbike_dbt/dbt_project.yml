name: "localbike"
version: "1.0.0"
config-version: 2
profile: "localbike"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  localbike:
    +schema: raw

models:
  localbike:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      # marts are what the dashboard reads, so they are stored as tables
      +materialized: table
      core:
        +schema: core
      reporting:
        +schema: reporting
